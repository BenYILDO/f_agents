name: Gecelik model (kalibre olasılık + DSR)

# Faz H — ağır ML'i (5-kat GBDT kalibrasyonu) günde bir kez koşar, sonucu
# Supabase model_cache'e yazar; saatlik iş bunu okuyup güven skoruna katar.
# Gerekli repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  schedule:
    # Her gün 19:30 UTC (~22:30 TR, kapanış sonrası).
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nightly-models
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-nightly.txt
      - name: Bağımlılıkları kur (scikit-learn dahil)
        run: pip install -r scripts/requirements-nightly.txt
      - name: Gecelik model hesabı
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BIST30_TICKERS: ${{ vars.BIST30_TICKERS }}
        run: python scripts/run_nightly_models.py
